name: Android debug build

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "companion/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "companion/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install companion dependencies
        run: pip install -r companion/requirements.txt
      - name: Check companion Python syntax
        run: python -m compileall -q companion/app
      - name: Run companion unit tests
        run: python -m unittest discover -s companion/tests -v
      - name: Assemble debug APK
        run: gradle :android:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allerflux-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14
